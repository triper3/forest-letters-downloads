name: Transfer verified current release
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: current-game-release-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Transfer public binary fragments and verify GitHub digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/cloud_transfer.py
