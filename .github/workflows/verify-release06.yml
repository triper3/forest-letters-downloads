name: Verify current06 public release
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: current06-public-http-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read every public fragment and verify the whole ZIP SHA
        run: python3 .github/verify_release_plan.py --config .github/release-verification-v0.6.0.json
