"name":"NoctisLauncherSetup-v0.7.0.exe","size":2472448,"digest":"sha256:99c5e4a66ce06a5e2cd744d8a0876bed0e8acf2ab2d58c2924eaf501a3500026"},{"name":"delivery-manifest.json","size":38048,"digest":"sha256:1881060b7786eb347ced4064b2b6e775d8675b8883648da36396223fc31e194e"},{"name":"SHA256SUMS.txt","size":17092,"digest":"sha256:f3e780805050281b80b1b41221c4a6032d2b79143342c2e3c18904c63a669740"}]}')
          assert os.environ['GITHUB_REPOSITORY']==CONFIG['repository']
          TOKEN=os.environ['GH_TOKEN']; PREFIX='/repos/'+CONFIG['repository']
          def api(method,path,body=None):
              assert path==PREFIX or path.startswith(PREFIX+'/')
              headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','User-Agent':'ForestLetters-Scoped06-Cleanup'}
              data=None if body is None else json.dumps(body).encode()
              if data is not None:headers['Content-Type']='application/json'
              for attempt in range(3):
                  try:
                      with API_OPENER.open(urllib.request.Request('https://api.github.com'+path,data=data,headers=headers,method=method),timeout=45) as response:
                          data_out=response.read();return json.loads(data_out) if data_out else None
                  except urllib.error.HTTPError as error:
                      if error.code==404:return None
                      raise
                  except (urllib.error.URLError,TimeoutError,ConnectionError):
                      if method not in ('GET','DELETE') or attempt==2:raise
                      time.sleep(2)
          def pages(path):
              result=[]
              for page in range(1,5):
                  rows=api('GET',path+('? ' if False else '?')+'per_page=100&page='+str(page));assert isinstance(rows,list)
                  result+=rows
                  if len(rows)<100:return result
              raise RuntimeError('Bounded page count exceeded')
          def check_current():
              release=api('GET',PREFIX+'/releases/'+str(CONFIG['currentRelease']))
              assert release['tag_name']=='v0.6.0' and not release['draft'] and CONFIG['fingerprint'] in release['body']
              actual=pages(PREFIX+'/releases/'+str(CONFIG['currentRelease'])+'/assets')
              expected={a['name']:a for a in CONFIG['newAssets']}
              assert len(actual)==161 and set(expected)=={a['name'] for a in actual}
              assert all(a['state']=='uploaded' and a['size']==expected[a['name']]['size'] and a.get('digest')==expected[a['name']]['digest'] for a in actual)
              for release in pages(PREFIX+'/releases'):
                  if not release.get('draft') and release.get('body','').startswith('<!-- noctis-managed-binary-release-v1 -->'):
                      assert tuple(map(int,release['tag_name'][1:].split('.'))) <= (0,6,0)
              return actual
          repo=api('GET',PREFIX)
          assert repo['private'] is False and repo['full_name']==CONFIG['repository']
          assert api('GET',PREFIX+'/actions/runs/40814621160')['conclusion']=='success'
          check_current()
          headers={'User-Agent':'NoctisLauncher/0.7.0','Accept-Encoding':'identity','Cache-Control':'no-cache'}
          with urllib.request.urlopen(urllib.request.Request('https://games.soldavia-demo.com/downloads/forest-letters/delivery-channel.json',headers=headers),timeout=45) as response:
              channel=json.load(response)
          assert channel['enabled'] and channel['version']=='0.6.0' and channel['sha256']==CONFIG['wholeSHA'] and channel['totalBytes']==CONFIG['gameBytes']
          url='https://noctis-game-updates.xiaoandy16.chatgpt.site/downloads/forest-letters/github/v0.6.0/ForestLetters-Windows-v0.6.0.zip.part001'
          with urllib.request.urlopen(urllib.request.Request(url,headers={**headers,'Range':'bytes=0-4095','Origin':'https://games.soldavia-demo.com'}),timeout=45) as response:
              assert response.status==206 and response.headers.get('Content-Range')=='bytes 0-4095/20971520'
              data=response.read(4097);assert len(data)==4096 and hashlib.sha256(data).hexdigest()==CONFIG['rangeSHA']
          release=api('GET',PREFIX+'/releases/'+str(CONFIG['oldRelease']))
          assert release['tag_name']=='v0.5.0'
          baseline={a['id']:a for a in CONFIG['oldAssets']};assert len(baseline)==107
          remaining=pages(PREFIX+'/releases/'+str(CONFIG['oldRelease'])+'/assets')
          assert all(a['id'] in baseline and a['name']==baseline[a['id']]['name'] and a['size']==baseline[a['id']]['size'] and a.get('digest')==baseline[a['id']]['digest'] for a in remaining)
          for asset in remaining:
              api('DELETE',PREFIX+'/releases/assets/'+str(asset['id']))
          assert not pages(PREFIX+'/releases/'+str(CONFIG['oldRelease'])+'/assets')
          check_current()
          retired=[]
          for name,wid in [('public-source-probe.yml',398439917),('transfer-current-release.yml',398444951),('verify-current-release.yml',398455027)]:
              row=api('GET',PREFIX+'/actions/workflows/'+str(wid));assert row['path']=='.github/workflows/'+name
              if row['state']=='active':api('PUT',PREFIX+'/actions/workflows/'+str(wid)+'/disable')
              assert api('GET',PREFIX+'/actions/workflows/'+str(wid))['state']=='disabled_manually';retired.append(wid)
          assert api('GET',PREFIX+'/actions/workflows/400170890')['state']=='active'
          proof=dict(success=True,published=True,version='0.6.0',releaseId=CONFIG['currentRelease'],assets=161,draft=False,latestOnlyPruningRequested=True,retiredOldReleaseId=CONFIG['oldRelease'],originalOldAssetCount=107,retiredOldAssetsFromBaseline=107,removedThisRun=len(remaining),remainingOldAssets=0,originalOldAssetBytes=sum(a['size'] for a in baseline.values()),gameSHA256=CONFIG['wholeSHA'],gameBytes=CONFIG['gameBytes'],retiredWorkflowIds=retired,sourceRepositoriesAccessed=False,oldReleaseAndTagsPreserved=True,newReleaseAssetsUnchanged=True,artifactsOrCacheCreated=False)
          print(json.dumps(proof),flush=True)
